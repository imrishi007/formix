services:
  - type: web
    name: formix-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FORMIX_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
