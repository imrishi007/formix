services:
  - type: web
    name: formix-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FORMIX_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FORMIX_JWT_EXPIRE_MINUTES
        value: "43200"
