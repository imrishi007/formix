services:
  - type: web
    name: formix-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # ⚠️  IMPORTANT — All sync:false vars MUST be set in the Render Dashboard
      #     (Dashboard → Environment Variables) before the service will work.
      #
      # ALLOWED_ORIGINS — Comma-separated list of frontend origins that may call
      # the API. Set this to your Vercel deployment URL(s). Examples:
      #   https://formix.vercel.app
      #   https://formix.vercel.app,https://formix-git-fix-xxx.vercel.app
      # Do NOT set this to the Render URL — that's added automatically.
      - key: ALLOWED_ORIGINS
        sync: false
      # DATABASE_URL — Your Neon Postgres connection string (from Neon dashboard).
      #   Format: postgresql://user:password@ep-xxxx.us-east-2.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # FORMIX_JWT_SECRET — Any strong random string. Use `openssl rand -hex 32` to generate.
      - key: FORMIX_JWT_SECRET
        sync: false
      # GROQ_API_KEY — From https://console.groq.com/keys (only needed for AI features).
      - key: GROQ_API_KEY
        sync: false
      - key: FORMIX_JWT_EXPIRE_MINUTES
        value: "43200"
